    <!-- Favicon fix: Inline SVG icon to prevent 404 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦷</text></svg>">
    <style>
      html { scroll-behavior: smooth; background: #ffffff; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI Variable Display", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #ffffff;
        color: #1d1d1f;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      .text-gradient {
        background: linear-gradient(95deg, #0284c7 0%, #0ea5e9 35%, #14b8a6 70%, #6366f1 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      /* Translucent white bar, like a product page global nav. Only element with backdrop blur. */
      .nav-glass {
        background: rgba(255, 255, 255, 0.78);
        backdrop-filter: saturate(180%) blur(20px);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      }
      @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
      .animate-rise { animation: rise 1s cubic-bezier(.2,.7,.2,1) both; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .connect-flow { animation: flow 1.4s linear infinite; }
      .no-scrollbar { scrollbar-width: none; }
      .no-scrollbar::-webkit-scrollbar { display: none; }

      /* Phones and tablets: no continuous animation, no live blur. */
      @media (pointer: coarse), (max-width: 1023px) {
        .connect-flow { animation: none; }
        .nav-glass { backdrop-filter: none; -webkit-backdrop-filter: none; background: rgba(255, 255, 255, 0.96); }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
      }

      /* Chat Markdown Styling */
      .chat-prose ul { list-style-type: disc; margin-left: 1.25rem; margin-top: 0.5rem; margin-bottom: 0.5rem; }
      .chat-prose li { margin-bottom: 0.25rem; }
      .chat-prose strong { font-weight: 700; color: #0f172a; }
      .chat-prose p { margin-bottom: 0.5rem; }
      .chat-prose p:last-child { margin-bottom: 0; }
    </style>
